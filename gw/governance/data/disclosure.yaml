# Canonical disclosure wording for Automatiqa Lab.
# This file is the source of truth. Copy it into a repo, pin the version, and change it HERE first.
# Bump `version` on any string change; repos propagate on their next release.

version: 2
schema: automatiqa-disclosure/1

# Rule the strings obey: state THAT content is AI-generated, never WHICH model produced it.
# Model identity is metadata only, and only where the operator chose the model.

interactive:
  # Art. 50(1) - a natural person is in a session with an agent.
  # Omit entirely where AI involvement is already obvious to a reasonably informed person.
  session_notice: "You are working with an AI agent. It drafts; you decide what stays."

document:
  # Art. 50(2) - a generated artefact leaves the system.
  # `drafted` = the model wrote it and a human accepted it.
  # `unreviewed` = the model wrote it and nobody has checked it yet.
  drafted: "AI-assisted · {drafted} of {total} items drafted by the agent, accepted by the author"
  unreviewed: "AI-assisted · {drafted} drafted by the agent · {pending} still pencil, not reviewed"
  # Emit nothing at all when drafted == 0. Blanket labelling is a defect, not caution.
  none: ""

report:
  # Long-form generated output where the model wrote sections rather than items.
  footer: >-
    The executive summary and the article summaries above were generated by AI from the linked
    sources. Headlines, figures and links are reproduced unmodified.
  # The same claim on a surface with no executive summary - a dashboard, a feed, a
  # panel. Give such a surface its own sentence rather than dropping the footer in
  # code: wording that carries a legal claim belongs in one reviewable file.
  dashboard_footer: >-
    Summaries marked "drafted by AI" on this page were generated by AI from the linked sources.
    Headlines, figures and links are reproduced unmodified.
  item_chip: "drafted by AI"
  source_chip: "source text"

deployer:
  # Shown to whoever redeploys a template or self-hosted tool.
  notice: >-
    This output contains AI-generated content and carries machine-readable marking. If you
    redistribute it in the EU you are a deployer under the EU AI Act - keep the marking intact.

contact: aleks@automatiqa.io
