# Gate model: Front-End Planning with a basic engineering estimate gate. Engineering-led corporate model.
# GTS (group technical standards) compliance is mandatory at FEP 3. Weights per gate sum to 100.
id: fep-bee
name: Front-End Planning with basic engineering estimate
applies_to: [greenfield, brownfield, extension, compliance]
dimensions: [schedule, cost, permits, design, vendors, site, systems, ops_readiness, safety, dependencies, forecast]
gates:
  - id: fep1
    name: FEP 1 | Feasibility
    order: 1
    purpose: is there a viable concept
    threshold: 0.70
    decisions: [pass, pass_with_actions, hold, stop]
    decided_by: [portfolio_lead]
    lead_time_days: 7
    actions_due_days: 30
    deliverables:
      - {id: business_need, name: Business need and scope statement, weight: 35, mandatory: true, evidence: document, accept_roles: [portfolio_lead]}
      - {id: estimate_class5, name: Class 5 order-of-magnitude estimate, weight: 25, mandatory: true, evidence: document, accept_roles: [project_manager], check: "project.estimate_class <= 5"}
      - {id: site_screen, name: Site and permit screen, weight: 20, mandatory: false, evidence: document, accept_roles: [project_manager], tags: [permits, site]}
      - {id: hse_screen, name: HSE screening, weight: 20, mandatory: false, evidence: document, accept_roles: [sme:hse], tags: [safety]}
  - id: fep2
    name: FEP 2 | Concept
    order: 2
    purpose: one concept selected
    threshold: 0.80
    decisions: [pass, pass_with_actions, hold, stop]
    decided_by: [portfolio_lead, sponsor]
    lead_time_days: 10
    actions_due_days: 30
    deliverables:
      - {id: concept_selection, name: Concept selection report, weight: 30, mandatory: true, evidence: document, accept_roles: [sme:engineering], tags: [design]}
      - {id: estimate_class4, name: Class 4 estimate, weight: 25, mandatory: true, evidence: document, accept_roles: [project_manager], check: "project.estimate_class <= 4"}
      - {id: permit_plan, name: Permit plan and authority pre-consultation, weight: 20, mandatory: false, evidence: document, accept_roles: [project_manager], party_role: authority, tags: [permits]}
      - {id: hazid, name: HAZID completed, weight: 25, mandatory: true, evidence: document, accept_roles: [sme:hse], tags: [safety]}
  - id: bee
    name: BEE | Basic engineering estimate
    order: 3
    purpose: basic engineering frozen, estimate fit to fund
    threshold: 0.85
    decisions: [pass, pass_with_actions, hold, stop]
    decided_by: [investment_committee]
    lead_time_days: 14
    actions_due_days: 30
    deliverables:
      - {id: basic_engineering, name: Basic engineering package, weight: 30, mandatory: true, evidence: document, accept_roles: [sme:engineering], tags: [design]}
      - {id: estimate_class3, name: Class 3 estimate (basic engineering), weight: 30, mandatory: true, evidence: document, accept_roles: [project_manager, portfolio_lead], check: "project.estimate_class <= 3"}
      - {id: long_lead_list, name: Long-lead equipment list with vendor quotes, weight: 20, mandatory: false, evidence: document, accept_roles: [sme:procurement], party_role: vendor, tags: [vendors]}
      - {id: hazop, name: HAZOP completed, weight: 20, mandatory: true, evidence: document, accept_roles: [sme:hse], tags: [safety]}
  - id: fep3
    name: FEP 3 | Definition
    order: 4
    purpose: ready to execute
    threshold: 0.90
    decisions: [pass, pass_with_actions, hold, stop]
    decided_by: [investment_committee]
    lead_time_days: 14
    actions_due_days: 30
    deliverables:
      - {id: gts_compliance, name: GTS compliance statement, weight: 25, mandatory: true, evidence: statement, accept_roles: [sme:engineering, sme:hse], tags: [design, safety]}
      - {id: permits_in_hand, name: Permits in hand, weight: 20, mandatory: true, evidence: permit_ref, accept_roles: [project_manager], party_role: authority, tags: [permits]}
      - {id: estimate_class2, name: Class 2 estimate, weight: 20, mandatory: true, evidence: document, accept_roles: [project_manager, portfolio_lead], check: "project.estimate_class <= 2"}
      - {id: execution_schedule, name: "Execution schedule, DCMA 14", weight: 15, mandatory: false, evidence: link, accept_roles: [project_manager], check: "dcma14.passed >= 12", tags: [schedule]}
      - {id: execution_plan, name: Project execution plan, weight: 20, mandatory: true, evidence: document, accept_roles: [project_manager]}
