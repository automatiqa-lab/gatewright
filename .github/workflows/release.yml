# On every published release, attach a software bill of materials (SPDX JSON) listing every
# dependency, as docs/13-security-privacy.md promises.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: gatewright-${{ github.event.release.tag_name }}.spdx.json
          upload-release-assets: true
